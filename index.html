<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino Royale - Planning Poker</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');

        :root {
            --felt-green: #0a4d2e;
            --felt-green-dark: #052e1b;
            --felt-accent: #0f6c41;
            --wood-dark: #2a1105;
            --wood-medium: #4a1f0a;
            --wood-light: #7c3a13;
            --gold: #dfb15b;
            --gold-bright: #ffd700;
            --gold-shadow: rgba(223, 177, 91, 0.5);
            --chip-red: #d32f2f;
            --chip-blue: #1976d2;
            --chip-gold: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --panel-bg: rgba(10, 20, 15, 0.85);
            --panel-border: rgba(223, 177, 91, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { 
            background-color: #030a06; 
            color: var(--text-main); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: 1rem; 
            overflow-x: hidden; 
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(15, 108, 65, 0.25) 0%, transparent 70%),
                radial-gradient(circle at 50% 100%, #000000 0%, transparent 80%);
        }

        .hidden { display: none !important; }

        /* CASINO CONTAINER & FRAME */
        .container {
            width: 100%; max-width: 1100px; 
            background: var(--panel-bg);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-radius: 36px; 
            border: 2px solid var(--gold);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9), 0 0 20px var(--gold-shadow); 
            overflow: hidden; margin: auto; position: relative;
        }

        /* LOGIN SCREEN */
        .login-card { padding: 3.5rem 2rem; text-align: center; max-width: 480px; margin: 0 auto; }
        .app-logo { 
            width: 86px; height: 86px; 
            background: linear-gradient(135deg, var(--wood-medium), var(--wood-dark)); 
            color: var(--gold-bright); border-radius: 50%; 
            display: inline-flex; align-items: center; justify-content: center; 
            font-size: 2.8rem; margin-bottom: 1.25rem; 
            border: 3px solid var(--gold);
            box-shadow: 0 0 25px var(--gold-shadow), inset 0 0 15px rgba(0,0,0,0.8); 
        }
        .casino-title { 
            font-family: 'Cinzel', serif; 
            font-size: 2.2rem; font-weight: 900; 
            background: linear-gradient(180deg, #fff 0%, var(--gold) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: 0.05em; margin-bottom: 0.3rem; 
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .login-card p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 2rem; }
        
        .form-group { margin-bottom: 1.25rem; text-align: left; }
        .form-group label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--gold); margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.08em; }
        
        input[type="text"], select {
            width: 100%; padding: 0.85rem 1rem; border: 1px solid var(--panel-border);
            border-radius: 14px; font-size: 0.95rem; outline: none; background: rgba(5, 15, 10, 0.8); color: white; transition: all 0.2s;
        }
        input[type="text"]:focus, select:focus { border-color: var(--gold); box-shadow: 0 0 12px var(--gold-shadow); }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            font-size: 0.95rem; font-weight: 700; padding: 0.85rem 1.5rem; border: none;
            border-radius: 14px; cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); width: 100%;
            text-transform: uppercase; letter-spacing: 0.05em;
        }
        .btn-primary { 
            background: linear-gradient(135deg, #c59b27, #7a5c0d); 
            color: #fff; border: 1px solid var(--gold-bright);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.4); 
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--gold-shadow); filter: brightness(1.1); }
        .btn-secondary { background: rgba(255, 255, 255, 0.08); color: var(--text-main); border: 1px solid var(--panel-border); }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.15); border-color: var(--gold); }
        .btn-danger { background: rgba(211, 47, 47, 0.2); color: #ff8a80; border: 1px solid rgba(211, 47, 47, 0.5); }
        .btn-danger:hover { background: rgba(211, 47, 47, 0.4); }
        .btn-sm { padding: 0.4rem 0.9rem; font-size: 0.8rem; width: auto; }

        /* GAME HEADER */
        .game-header { padding: 1.25rem 1.75rem; border-bottom: 1px solid var(--panel-border); display: flex; align-items: center; justify-content: space-between; background: rgba(5, 12, 8, 0.8); }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .room-badge { background: rgba(223, 177, 91, 0.15); color: var(--gold-bright); border: 1px solid var(--gold); padding: 0.35rem 0.9rem; border-radius: 20px; font-weight: 700; font-size: 0.85rem; font-family: 'Cinzel', serif; }
        .btn-copy { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--panel-border); color: var(--text-muted); padding: 0.35rem 0.75rem; border-radius: 20px; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-copy:hover { color: white; border-color: var(--gold); }

        .game-body { padding: 1.5rem; display: flex; flex-direction: column; gap: 1.5rem; }

        /* STORY TITLE BAR */
        .story-bar {
            background: rgba(5, 15, 10, 0.8); border: 1px solid var(--panel-border);
            border-radius: 16px; padding: 0.75rem 1.25rem; display: flex; align-items: center; gap: 12px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.8);
        }
        .story-input {
            background: transparent; border: none; color: white; font-weight: 600; font-size: 1rem; width: 100%; outline: none;
        }
        .story-input::placeholder { color: var(--text-muted); font-weight: 400; }

        /* CASINO POKER TABLE */
        .poker-arena { width: 100%; display: flex; flex-direction: column; gap: 1rem; position: relative; }
        
        .casino-table-frame {
            background: linear-gradient(135deg, var(--wood-light) 0%, var(--wood-dark) 50%, #150802 100%);
            border-radius: 120px;
            padding: 22px;
            box-shadow: 
                0 20px 40px rgba(0,0,0,0.9), 
                inset 0 3px 6px rgba(255,255,255,0.3), 
                inset 0 -6px 12px rgba(0,0,0,0.9);
            border: 2px solid #3d1a08;
            position: relative;
        }

        .casino-felt {
            background: radial-gradient(ellipse at center, var(--felt-green) 0%, var(--felt-green-dark) 85%);
            border-radius: 100px;
            padding: 2rem;
            border: 3px solid rgba(223, 177, 91, 0.3);
            box-shadow: inset 0 0 60px rgba(0,0,0,0.8), 0 0 10px rgba(0,0,0,0.5);
            position: relative;
            min-height: 380px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .casino-felt::before {
            content: "♠ ♥ POKER CASINO ♣ ♦";
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-family: 'Cinzel', serif; font-size: 1.8rem; font-weight: 900;
            color: rgba(223, 177, 91, 0.06); pointer-events: none; white-space: nowrap;
            letter-spacing: 0.3em;
        }

        .tables-container { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; width: 100%; z-index: 2; }

        .role-zone {
            border-radius: 22px; padding: 1.25rem; position: relative; min-height: 220px;
            display: flex; flex-direction: column; align-items: center; 
            background: rgba(0, 0, 0, 0.2); 
            border: 1px dashed rgba(223, 177, 91, 0.25);
        }

        .zone-title {
            font-family: 'Cinzel', serif; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em;
            margin-bottom: 1.2rem; padding: 4px 16px; border-radius: 20px; background: rgba(5, 12, 8, 0.8);
            border: 1px solid var(--gold); color: var(--gold-bright);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .players-grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; width: 100%; }

        /* ========================================================= */
        /* PROPOSITION 3 : STYLES DES CARTES & INDICATEUR DE VOTE     */
        /* ========================================================= */
        .player-card { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            width: 95px; 
            padding: 8px 6px;
            border-radius: 16px;
            position: relative; 
            background: rgba(5, 15, 10, 0.5);
            /* État par défaut : en attente de vote */
            border: 1px dashed rgba(223, 177, 91, 0.3);
            opacity: 0.75;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* État lorsque le joueur A VOTÉ */
        .player-card.has-voted {
            opacity: 1;
            border: 2px solid var(--gold-bright);
            background: rgba(15, 30, 20, 0.85);
            box-shadow: 0 0 15px var(--gold-shadow), inset 0 0 10px rgba(255, 215, 0, 0.15);
            transform: translateY(-2px);
        }

        .avatar-chair {
            width: 52px; height: 52px; border-radius: 50%; 
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; box-shadow: 0 6px 15px rgba(0,0,0,0.6); position: relative;
        }

        /* JETON DE POKER EN HAUT À DROITE DE LA CARTE */
        .chip-voted {
            position: absolute; 
            top: -6px; 
            right: -6px;
            width: 24px; 
            height: 24px; 
            border-radius: 50%;
            background: radial-gradient(circle, #f59e0b 40%, #b45309 100%);
            border: 2px dashed #ffffff;
            box-shadow: 0 3px 8px rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            font-weight: 900;
            color: #fff;
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 5;
        }

        @keyframes popIn {
            0% { transform: scale(0) rotate(-45deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .player-name {
            font-size: 0.75rem; font-weight: 700; margin-top: 6px; text-align: center;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 85px; color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
        }

        /* 3D FLIP CARTE DU CASINO */
        .card-flip-container {
            width: 44px; height: 64px; perspective: 1000px; margin-top: 8px;
        }
        .card-flip-inner {
            width: 100%; height: 100%; position: relative; transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-flip-container.flipped .card-flip-inner { transform: rotateY(180deg); }

        .card-face {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            border-radius: 8px; display: flex; justify-content: center; align-items: center;
            font-weight: 800; font-size: 1.2rem; box-shadow: 0 6px 15px rgba(0,0,0,0.5);
        }
        .card-face.front {
            background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 100%);
            color: #0f172a; border: 2px solid #ffffff; transform: rotateY(180deg);
            font-family: 'Cinzel', serif;
        }
        .card-face.back {
            background: 
                radial-gradient(circle, #991b1b 20%, transparent 20%),
                linear-gradient(135deg, #7f1d1d 0%, #450a0a 100%);
            background-size: 8px 8px, 100% 100%;
            border: 2px solid var(--gold); 
            box-shadow: inset 0 0 8px rgba(0,0,0,0.8);
        }

        /* SPECTATEURS (PO) */
        .spectators-bar {
            background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(223, 177, 91, 0.3); border-radius: 14px;
            padding: 0.6rem 1.2rem; display: flex; align-items: center; gap: 12px; font-size: 0.85rem; z-index: 2; margin-top: 1rem;
        }
        .spectators-list { display: flex; gap: 8px; flex-wrap: wrap; }

        /* PALETTE D'EMOJIS CASINO */
        .reaction-bar {
            display: flex; justify-content: center; gap: 8px; background: rgba(5, 15, 10, 0.9);
            padding: 8px 18px; border-radius: 30px; border: 1px solid var(--gold);
            box-shadow: 0 10px 25px rgba(0,0,0,0.6); margin: 0 auto; width: fit-content; flex-wrap: wrap;
        }
        .reaction-btn {
            font-size: 1.35rem; background: none; border: none; cursor: pointer;
            transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1); padding: 4px 6px; border-radius: 10px;
        }
        .reaction-btn:hover { transform: scale(1.4) translateY(-3px); background: rgba(255,255,255,0.08); }

        .floating-emoji {
            position: absolute; font-size: 2.5rem; pointer-events: none; z-index: 100;
            animation: floatUp 2s cubic-bezier(0.25, 1, 0.5, 1) forwards; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.8));
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, 0) scale(0.5) rotate(0deg); }
            50% { opacity: 0.9; transform: translate(calc(-50% + (var(--random-x) * 1px)), -90px) scale(1.4) rotate(var(--random-r)); }
            100% { opacity: 0; transform: translate(calc(-50% + (var(--random-x) * 1.5px)), -200px) scale(1) rotate(var(--random-r)); }
        }

        /* DECK DE CARTES DU JOUEUR */
        .hand-container { text-align: center; background: rgba(5, 15, 10, 0.8); border: 1px solid var(--gold); padding: 1.25rem; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .hand-title { font-family: 'Cinzel', serif; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: var(--gold-bright); margin-bottom: 0.8rem; letter-spacing: 0.08em; }
        .deck-grid { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        
        .poker-card {
            width: 52px; height: 78px; 
            border: 2px solid var(--gold); border-radius: 10px;
            background: linear-gradient(145deg, #ffffff, #e2e8f0); 
            font-family: 'Cinzel', serif; font-size: 1.3rem; font-weight: 900; color: #0f172a;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); user-select: none; 
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
        }
        .poker-card:hover { transform: translateY(-10px) scale(1.08); border-color: #fff; box-shadow: 0 12px 25px var(--gold-shadow); }
        .poker-card.selected { 
            background: linear-gradient(135deg, var(--gold-bright), #b45309); 
            color: #ffffff; transform: translateY(-14px); 
            border-color: #ffffff; box-shadow: 0 14px 30px var(--gold-shadow); 
        }

        /* STATISTIQUES CASINO */
        .stats-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .stats-box { background: rgba(223, 177, 91, 0.1); border: 1px solid var(--gold); border-radius: 16px; padding: 1rem; text-align: center; }
        .stat-value { font-family: 'Cinzel', serif; font-size: 1.8rem; font-weight: 800; color: var(--gold-bright); }
        .stat-label { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }

        .controls-bar { display: flex; gap: 12px; justify-content: center; border-top: 1px solid var(--panel-border); padding-top: 1.25rem; }
        .controls-bar .btn { width: auto; min-width: 200px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- ECRAN D'ACCUEIL CASINO -->
        <div id="login-screen" class="login-card">
            <div class="app-logo">🎰</div>
            <h1 class="casino-title">Casino Royale</h1>
            <p>Planning Poker Agile & Prestige</p>

            <form onsubmit="handleJoin(event)">
                <div class="form-group">
                    <label for="username">Nom du Joueur</label>
                    <input type="text" id="username" placeholder="ex: James Bond" required autofocus autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="user-role">Votre Rôle à la table</label>
                    <select id="user-role" required>
                        <option value="DEV">🎩 Devs</option>
                        <option value="TESTER">🕵️ Testeur/QA</option>
                        <option value="BA">🤵 BA/PO</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="room-id">Code de la Table</label>
                    <input type="text" id="room-id" required autocomplete="off">
                </div>
                <button type="submit" id="btn-submit" class="btn btn-primary">Rejoindre la table ♠️</button>
            </form>
            <p id="status-msg" style="margin-top: 1.25rem; font-size: 0.85rem; color: var(--text-muted);"></p>
        </div>

        <!-- PLATEAU DE JEU CASINO -->
        <div id="game-screen" class="hidden">
            <header class="game-header">
                <div class="header-left">
                    <span class="room-badge" id="display-room"></span>
                    <button class="btn-copy" onclick="copyTableLink()" id="btn-copy-link">🔗 Copier l'invitation</button>
                </div>
                <button class="btn btn-danger btn-sm" onclick="location.reload()">Quitter la table</button>
            </header>

            <div class="game-body">
                <!-- TITRE DE LA USER STORY -->
                <div class="story-bar">
                    <span>🎰</span>
                    <input type="text" id="story-title" class="story-input" placeholder="User Story en cours d'estimation (ex: JIRA-1042)..." oninput="broadcastStoryTitle(this.value)">
                </div>

                <div class="poker-arena" id="poker-arena">
                    <div class="casino-table-frame">
                        <div class="casino-felt">
                            <div class="tables-container">
                                <!-- TABLE DEVS -->
                                <div class="role-zone">
                                    <div class="zone-title">🎩 Devs</div>
                                    <div class="players-grid" id="dev-players"></div>
                                </div>

                                <!-- TABLE TESTEURS -->
                                <div class="role-zone">
                                    <div class="zone-title">🕵️ Testeur/QA</div>
                                    <div class="players-grid" id="tester-players"></div>
                                </div>
                            </div>

                            <!-- SPECTATEURS (CROUPIERS / PO / BA) -->
                            <div class="spectators-bar">
                                <strong style="color: var(--gold-bright);">🤵 BA/PO :</strong>
                                <div class="spectators-list" id="spectator-players"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- PALETTE D'EMOJIS CASINO -->
                <div class="reaction-bar">
                    <button class="reaction-btn" onclick="sendEmoji('👏')" title="Bravo !">👏</button>
                    <button class="reaction-btn" onclick="sendEmoji('🎲')" title="Un coup de dés !">🎲</button>
                    <button class="reaction-btn" onclick="sendEmoji('🚀')" title="Facile / Rapide">🚀</button>
                    <button class="reaction-btn" onclick="sendEmoji('🤯')" title="Ultra complexe">🤯</button>
                    <button class="reaction-btn" onclick="sendEmoji('❓')" title="Pas clair...">❓</button>
                    <button class="reaction-btn" onclick="sendEmoji('🔥')" title="Ça brûle !">🔥</button>
                    <button class="reaction-btn" onclick="sendEmoji('☕')" title="Pause café">☕</button>
                    <button class="reaction-btn" onclick="sendEmoji('🍿')" title="J'écoute le débat">🍿</button>
                    <button class="reaction-btn" onclick="sendEmoji('💎')" title="Code d'exception">💎</button>
                    <button class="reaction-btn" onclick="sendEmoji('💸')" title="Ça va coûter cher !">💸</button>
                </div>

                <!-- STATS -->
                <div id="stats-summary" class="stats-wrapper hidden">
                    <div class="stats-box">
                        <div class="stat-value" id="stat-dev-avg">-</div>
                        <div class="stat-label">Moyenne Flambeurs</div>
                    </div>
                    <div class="stats-box">
                        <div class="stat-value" id="stat-qa-avg">-</div>
                        <div class="stat-label">Moyenne Inspecteurs</div>
                    </div>
                </div>

                <!-- MAIN DU JOUEUR -->
                <div class="hand-container">
                    <div class="hand-title" id="deck-title">Faites vos jeux !</div>
                    <div class="deck-grid" id="deck"></div>
                </div>

                <div class="controls-bar">
                    <button class="btn btn-primary" onclick="triggerReveal()">👀 Abattre les cartes</button>
                    <button class="btn btn-secondary" onclick="triggerReset()">🔄 Tour suivant</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CARD_VALUES = [0, 1, 2, 3, 5, 8, 13, 21, 34, 55, '☕', '❓'];
        let peer = null, isHost = false;
        let myName = '', myRole = 'DEV', roomCode = '', myVote = null, isRevealed = false;
        let connections = []; 
        let hostConn = null;  
        let gameState = { players: {}, revealed: false, storyTitle: '' };

        function playChipSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1200, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.08);
            } catch(e) {}
        }

        window.addEventListener('DOMContentLoaded', () => {
            const urlHash = window.location.hash.replace('#', '').trim();
            const inputRoom = document.getElementById('room-id');
            inputRoom.value = urlHash ? urlHash : 'casino-' + Math.floor(100 + Math.random() * 900);
        });

        function copyTableLink() {
            const fullUrl = window.location.origin + window.location.pathname + '#' + roomCode;
            navigator.clipboard.writeText(fullUrl).then(() => {
                const btn = document.getElementById('btn-copy-link');
                btn.innerText = '✓ Copié !';
                setTimeout(() => btn.innerText = "🔗 Copier l'invitation", 2000);
            });
        }

        function handleJoin(e) {
            e.preventDefault();
            myName = document.getElementById('username').value.trim();
            myRole = document.getElementById('user-role').value;
            roomCode = document.getElementById('room-id').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');

            if (!myName || !roomCode) return;
            window.location.hash = roomCode;

            document.getElementById('btn-submit').disabled = true;
            document.getElementById('status-msg').innerText = "Ouverture de la table...";

            const hostPeerId = "poker-casino-room-v1-" + roomCode;
            peer = new Peer(hostPeerId);

            peer.on('open', () => {
                isHost = true;
                gameState.players[peer.id] = { name: myName, role: myRole, vote: null };
                setupGameUI();
                
                peer.on('connection', (conn) => {
                    connections.push(conn);
                    conn.on('data', (data) => handleDataFromClient(conn, data));
                    conn.on('close', () => {
                        delete gameState.players[conn.peer];
                        checkAutoReveal();
                        broadcastState();
                    });
                });
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    peer = new Peer();
                    peer.on('open', () => {
                        isHost = false;
                        hostConn = peer.connect(hostPeerId);
                        
                        hostConn.on('open', () => {
                            setupGameUI();
                            hostConn.send({ type: 'JOIN', name: myName, role: myRole });
                        });

                        hostConn.on('data', (data) => {
                            if (data.type === 'STATE_UPDATE') {
                                gameState = data.state;
                                isRevealed = gameState.revealed;
                                
                                if (!gameState.revealed && gameState.players[peer.id] && gameState.players[peer.id].vote === null) {
                                    myVote = null;
                                }

                                document.getElementById('story-title').value = gameState.storyTitle || '';
                                renderDeck();
                                renderTable();
                            } else if (data.type === 'EMOJI') {
                                spawnFloatingEmoji(data.peerId, data.emoji);
                            }
                        });
                    });
                } else {
                    document.getElementById('status-msg').innerText = "Erreur de connexion à la table.";
                    document.getElementById('btn-submit').disabled = false;
                }
            });
        }

        function setupGameUI() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('display-room').innerText = '#' + roomCode;
            renderDeck();
            renderTable();
        }

        function checkAutoReveal() {
            if (!isHost || gameState.revealed) return;
            const voters = Object.values(gameState.players).filter(p => p.role !== 'BA');
            if (voters.length === 0) return;
            const allVoted = voters.every(p => p.vote !== null && p.vote !== undefined);
            if (allVoted) triggerReveal();
        }

        function broadcastStoryTitle(val) {
            if (isHost) {
                gameState.storyTitle = val;
                broadcastState();
            } else if (hostConn && hostConn.open) {
                hostConn.send({ type: 'STORY_UPDATE', title: val });
            }
        }

        function handleDataFromClient(conn, data) {
            if (!isHost) return;
            if (data.type === 'JOIN') {
                gameState.players[conn.peer] = { name: data.name, role: data.role, vote: null };
                broadcastState();
            } else if (data.type === 'VOTE') {
                if (gameState.players[conn.peer]) gameState.players[conn.peer].vote = data.vote;
                checkAutoReveal();
                broadcastState();
            } else if (data.type === 'STORY_UPDATE') {
                gameState.storyTitle = data.title;
                broadcastState();
            } else if (data.type === 'REVEAL') {
                triggerReveal();
            } else if (data.type === 'RESET') {
                triggerReset();
            } else if (data.type === 'EMOJI') {
                spawnFloatingEmoji(conn.peer, data.emoji);
                connections.forEach(c => {
                    if (c.open) c.send({ type: 'EMOJI', peerId: conn.peer, emoji: data.emoji });
                });
            }
        }

        function broadcastState() {
            if (!isHost) return;
            isRevealed = gameState.revealed;
            renderDeck();
            renderTable();
            connections.forEach(conn => {
                if (conn.open) conn.send({ type: 'STATE_UPDATE', state: gameState });
            });
        }

        function selectVote(val) {
            if (myRole === 'BA' || isRevealed) return;
            playChipSound();
            myVote = (myVote === val) ? null : val;
            
            if (isHost) {
                gameState.players[peer.id].vote = myVote;
                checkAutoReveal();
                broadcastState();
            } else if (hostConn && hostConn.open) {
                hostConn.send({ type: 'VOTE', vote: myVote });
            }
            renderDeck();
        }

        function sendEmoji(emoji) {
            const senderId = peer.id;
            spawnFloatingEmoji(senderId, emoji);

            if (isHost) {
                connections.forEach(c => {
                    if (c.open) c.send({ type: 'EMOJI', peerId: senderId, emoji: emoji });
                });
            } else if (hostConn && hostConn.open) {
                hostConn.send({ type: 'EMOJI', emoji: emoji });
            }
        }

        function spawnFloatingEmoji(senderId, emoji) {
            const playerEl = document.querySelector(`[data-peer-id="${senderId}"]`);
            const arena = document.getElementById('poker-arena');
            if (!arena) return;

            const el = document.createElement('div');
            el.className = 'floating-emoji';
            el.innerText = emoji;

            let startX = arena.offsetWidth / 2;
            let startY = arena.offsetHeight / 2;

            if (playerEl) {
                const rect = playerEl.getBoundingClientRect();
                const arenaRect = arena.getBoundingClientRect();
                startX = rect.left - arenaRect.left + (rect.width / 2);
                startY = rect.top - arenaRect.top + (rect.height / 2);
            }

            el.style.left = startX + 'px';
            el.style.top = startY + 'px';
            el.style.setProperty('--random-x', (Math.random() * 120 - 60).toString());
            el.style.setProperty('--random-r', (Math.random() * 40 - 20) + 'deg');

            arena.appendChild(el);
            setTimeout(() => el.remove(), 2000);
        }

        function triggerReveal() {
            if (isHost) {
                gameState.revealed = true;
                broadcastState();
                checkConsensus();
            } else if (hostConn && hostConn.open) {
                hostConn.send({ type: 'REVEAL' });
            }
        }

        function triggerReset() {
            myVote = null;

            if (isHost) {
                gameState.revealed = false;
                Object.keys(gameState.players).forEach(id => gameState.players[id].vote = null);
                broadcastState();
            } else if (hostConn && hostConn.open) {
                renderDeck();
                hostConn.send({ type: 'RESET' });
            }
        }

        function checkConsensus() {
            const votes = Object.values(gameState.players)
                .filter(p => p.role !== 'BA' && typeof p.vote === 'number')
                .map(p => p.vote);

            if (votes.length > 1 && votes.every(v => v === votes[0])) {
                confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
            }
        }

        function renderDeck() {
            const deck = document.getElementById('deck'); deck.innerHTML = '';
            const deckTitle = document.getElementById('deck-title');

            if (myRole === 'BA') {
                deckTitle.innerText = "🤵 Croupier / Facilitateur";
                deck.innerHTML = `<div style="color:var(--text-muted); font-size:0.85rem; padding:0.5rem;">Vous dirigez la table sans miser de jetons.</div>`;
                return;
            }

            deckTitle.innerText = isRevealed ? "Les jeux sont faits" : "Faites vos jeux !";
            CARD_VALUES.forEach(val => {
                const btn = document.createElement('div');
                btn.className = `poker-card ${myVote === val ? 'selected' : ''}`;
                btn.innerText = val; 
                btn.onclick = () => selectVote(val);
                deck.appendChild(btn);
            });
        }

        /* ========================================================= */
        /* RENDER TABLE : APPLICATION DYNAMIQUE DES CLASSES DE VOTE   */
        /* ========================================================= */
        function renderTable() {
            const devContainer = document.getElementById('dev-players');
            const testerContainer = document.getElementById('tester-players');
            const specContainer = document.getElementById('spectator-players');

            devContainer.innerHTML = ''; testerContainer.innerHTML = ''; specContainer.innerHTML = '';

            const devVotes = [], qaVotes = [];

            Object.entries(gameState.players).forEach(([pId, p]) => {
                const hasVoted = p.role !== 'BA' && p.vote !== null && p.vote !== undefined;

                if (p.role === 'BA') {
                    const specBadge = document.createElement('span');
                    specBadge.className = 'player-name';
                    specBadge.setAttribute('data-peer-id', pId);
                    specBadge.style.cssText = "background:rgba(223, 177, 91, 0.1); padding: 4px 10px; border-radius:12px; border:1px solid var(--gold); color: var(--gold-bright); font-weight:700;";
                    specBadge.innerText = `🤵 ${p.name}`;
                    specContainer.appendChild(specBadge);
                    return;
                }

                const playerEl = document.createElement('div');
                // Ajout de la classe 'has-voted' pour déclencher la Proposition 3
                playerEl.className = `player-card ${hasVoted ? 'has-voted' : ''}`;
                playerEl.setAttribute('data-peer-id', pId);

                let flipClass = (hasVoted && isRevealed) ? 'flipped' : '';
                let frontValue = (hasVoted && isRevealed) ? p.vote : '';

                if (hasVoted && isRevealed && typeof p.vote === 'number') {
                    if (p.role === 'DEV') devVotes.push(p.vote);
                    if (p.role === 'TESTER') qaVotes.push(p.vote);
                }

                const avatarEmoji = p.role === 'DEV' ? '🎩' : '🕵️';

                playerEl.innerHTML = `
                    ${hasVoted ? '<div class="chip-voted" title="A voté !">✓</div>' : ''}
                    <div class="avatar-chair">
                        ${avatarEmoji}
                    </div>
                    <div class="card-flip-container ${flipClass}">
                        <div class="card-flip-inner">
                            <div class="card-face back"></div>
                            <div class="card-face front">${frontValue}</div>
                        </div>
                    </div>
                    <div class="player-name">${escapeHtml(p.name)}</div>
                `;

                if (p.role === 'DEV') devContainer.appendChild(playerEl);
                else if (p.role === 'TESTER') testerContainer.appendChild(playerEl);
            });

            const statsBox = document.getElementById('stats-summary');
            if (isRevealed && (devVotes.length > 0 || qaVotes.length > 0)) {
                statsBox.classList.remove('hidden');
                document.getElementById('stat-dev-avg').innerText = devVotes.length ? (devVotes.reduce((a,b)=>a+b,0)/devVotes.length).toFixed(1) : '-';
                document.getElementById('stat-qa-avg').innerText = qaVotes.length ? (qaVotes.reduce((a,b)=>a+b,0)/qaVotes.length).toFixed(1) : '-';
            } else {
                statsBox.classList.add('hidden');
            }
        }

        function escapeHtml(t) { return t.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m])); }
    </script>
</body>
